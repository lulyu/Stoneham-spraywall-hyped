name: Wall rescan
on:
  pull_request:
    paths:
      - 'tools/wall_rescan/**'
      - 'tests/wall_rescan/**'
      - 'tools/sam2_annotation_server.py'
      - '.github/workflows/wall-rescan.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  registration:
    name: Offline registration checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/wall_rescan/requirements.txt
      - run: python -m pip install -r tools/wall_rescan/requirements.txt
      - run: python -m unittest discover -s tests/wall_rescan -v
